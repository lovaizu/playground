<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 900">
  <title>invoice のコンポーネント</title>
  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'Hiragino Sans', 'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif; }
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .store { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .head { fill: #59636e; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .store { fill: #2e2a1a; stroke: #d29922; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1300" height="900"/>
  <circle class="ext" cx="170" cy="38" r="11"/>
  <rect class="ext" x="40" y="50" width="260" height="80" rx="22"/>
  <text class="name mid" x="170" y="86">利用者</text>
  <text class="kind mid" x="170" y="108">[経理チームのメンバー]</text>
  <rect class="box" x="40" y="260" width="260" height="100"/>
  <text class="name mid" x="170" y="305">コマンド</text>
  <text class="kind mid" x="170" y="327">[コマンドラインのプログラム]</text>
  <rect class="box" x="480" y="40" width="280" height="90"/>
  <text class="name mid" x="620" y="82">明細の読み取り</text>
  <text class="kind mid" x="620" y="104">[モジュール]</text>
  <rect class="box" x="480" y="200" width="280" height="90"/>
  <text class="name mid" x="620" y="242">発行者情報の保管</text>
  <text class="kind mid" x="620" y="264">[モジュール]</text>
  <rect class="box" x="480" y="360" width="280" height="90"/>
  <text class="name mid" x="620" y="402">請求の計算</text>
  <text class="kind mid" x="620" y="424">[モジュール]</text>
  <rect class="box" x="480" y="540" width="280" height="90"/>
  <text class="name mid" x="620" y="582">請求書の組版</text>
  <text class="kind mid" x="620" y="604">[モジュール]</text>
  <rect class="box" x="900" y="360" width="280" height="90"/>
  <text class="name mid" x="1040" y="402">番号の採番</text>
  <text class="kind mid" x="1040" y="424">[モジュール]</text>
  <rect class="box" x="40" y="540" width="260" height="90"/>
  <text class="name mid" x="170" y="582">印刷</text>
  <text class="kind mid" x="170" y="604">[モジュール]</text>
  <rect class="store" x="900" y="200" width="280" height="90"/>
  <text class="name mid" x="1040" y="250">発行者情報</text>
  <rect class="store" x="900" y="540" width="280" height="90"/>
  <text class="name mid" x="1040" y="590">発行記録</text>
  <rect class="ext" x="40" y="720" width="260" height="70" rx="6"/>
  <text class="name mid" x="170" y="760">印刷システム</text>
  <rect class="ext" x="440" y="720" width="300" height="70" rx="6"/>
  <text class="name mid" x="590" y="760">既定のプリンター</text>
  <path class="line" d="M170,130 L170,256" marker-end="url(#arrow)"/>
  <text class="label small start" x="180" y="185">明細のファイルを渡し、問いに答える</text>
  <text class="data start" x="180" y="201">明細, 発行者情報</text>
  <path class="line" d="M300,275 L476,95" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="388" y="168">読ませる</text>
  <text class="data halo mid" x="388" y="186">明細 → 明細行, 直すところ</text>
  <path class="line" d="M300,295 L476,250" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="388" y="262">求める、確かめさせる、残させる</text>
  <text class="data halo mid" x="388" y="288">発行者情報 → 発行者情報, 直すところ</text>
  <path class="line" d="M300,325 L476,400" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="388" y="352">請求書にさせる</text>
  <text class="data halo mid" x="388" y="380">明細行, 発行者情報 → 請求書</text>
  <path class="line" d="M300,345 L476,580" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="400" y="452">紙面にさせる</text>
  <text class="data halo mid" x="400" y="470">請求書 → 印刷用の文書</text>
  <path class="line" d="M170,360 L170,536" marker-end="url(#arrow)"/>
  <text class="label small start" x="180" y="500">印刷させる</text>
  <text class="data start" x="180" y="516">印刷用の文書 → 送った枚数, 直すところ</text>
  <path class="line" d="M760,245 L896,245" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="828" y="235">読み書きする</text>
  <path class="line" d="M760,405 L896,405" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="828" y="395">番号を求める</text>
  <text class="data halo mid" x="828" y="423">請求書</text>
  <path class="line" d="M1040,450 L1040,536" marker-end="url(#arrow)"/>
  <text class="label small start" x="1050" y="497">読み書きする</text>
  <path class="line" d="M170,630 L170,716" marker-end="url(#arrow)"/>
  <text class="label small start" x="180" y="670">既定のプリンターに送る</text>
  <text class="data start" x="180" y="686">印刷用の文書</text>
  <path class="line" d="M300,755 L436,755" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="368" y="745">印刷させる</text>
  <text class="frame-name start" x="40" y="845">凡例</text>
  <rect class="box" x="90" y="830" width="36" height="22"/>
  <text class="label small start" x="134" y="845">コンポーネント [種類]</text>
  <rect class="store" x="290" y="830" width="36" height="22"/>
  <text class="label small start" x="334" y="845">残すデータ</text>
  <rect class="ext" x="430" y="830" width="36" height="22" rx="6"/>
  <text class="label small start" x="474" y="845">invoice の外にあるもの、頭付きはプロダクトビジョンの役割</text>
  <text class="label small start" x="880" y="840">矢印: 何をさせるか</text>
  <text class="data start" x="880" y="858">受け渡すデータ、→ の右は返るもの</text>
</svg>
