<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', sans-serif" font-size="14">
  <title>invoice のしくみ</title>
  <desc>明細のファイルを一つ渡すだけで、invoice が請求書を作って印刷する流れと、各部分が答える心配。</desc>
  <rect width="900" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <text x="450" y="34" text-anchor="middle" font-size="17" font-weight="bold">明細のファイルを一つ渡すだけで、請求書を作ってそのまま印刷する</text>
  <rect x="20" y="70" width="190" height="80" rx="8" fill="#eef4fb" stroke="#3b6ea5"/>
  <text x="115" y="104" text-anchor="middle" font-weight="bold">準備</text>
  <text x="115" y="128" text-anchor="middle">ガイドのコマンドを貼るだけ</text>
  <rect x="245" y="70" width="190" height="80" rx="8" fill="#eef4fb" stroke="#3b6ea5"/>
  <text x="340" y="104" text-anchor="middle" font-weight="bold">コマンド一つ</text>
  <text x="340" y="128" text-anchor="middle">invoice 明細.csv</text>
  <rect x="470" y="70" width="190" height="80" rx="8" fill="#eef4fb" stroke="#3b6ea5"/>
  <text x="565" y="104" text-anchor="middle" font-weight="bold">請求書を作る</text>
  <text x="565" y="128" text-anchor="middle">適格請求書の項目と計算</text>
  <rect x="695" y="70" width="185" height="80" rx="8" fill="#eef4fb" stroke="#3b6ea5"/>
  <text x="787" y="104" text-anchor="middle" font-weight="bold">印刷する</text>
  <text x="787" y="128" text-anchor="middle">既定のプリンターへ</text>
  <line x1="210" y1="110" x2="243" y2="110" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="435" y1="110" x2="468" y2="110" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="660" y1="110" x2="693" y2="110" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <g font-size="13">
    <rect x="20" y="180" width="190" height="120" rx="6" fill="#fff8e6" stroke="#c9a227"/>
    <text x="30" y="204" font-weight="bold">心配</text>
    <text x="30" y="226">コマンドを使ったことが</text>
    <text x="30" y="246">なくても準備できる?</text>
    <text x="30" y="276" font-weight="bold">得られること</text>
    <text x="30" y="294">Python を書かずに準備</text>
    <rect x="245" y="180" width="190" height="120" rx="6" fill="#fff8e6" stroke="#c9a227"/>
    <text x="255" y="204" font-weight="bold">心配</text>
    <text x="255" y="226">毎月の請求書に</text>
    <text x="255" y="246">手間はかからない?</text>
    <text x="255" y="276" font-weight="bold">得られること</text>
    <text x="255" y="294">翌月からは一行で印刷</text>
    <rect x="470" y="180" width="190" height="120" rx="6" fill="#fff8e6" stroke="#c9a227"/>
    <text x="480" y="204" font-weight="bold">心配</text>
    <text x="480" y="226">取引先に出せる?</text>
    <text x="480" y="246">計算は合っている?</text>
    <text x="480" y="276" font-weight="bold">得られること</text>
    <text x="480" y="294">登録番号と税率ごとの税額</text>
    <rect x="695" y="180" width="185" height="120" rx="6" fill="#fff8e6" stroke="#c9a227"/>
    <text x="705" y="204" font-weight="bold">心配</text>
    <text x="705" y="226">つまずいたら開発者に</text>
    <text x="705" y="246">聞くしかないのでは</text>
    <text x="705" y="276" font-weight="bold">得られること</text>
    <text x="705" y="294">直す行と直し方の表示</text>
    <line x1="115" y1="150" x2="115" y2="180" stroke="#c9a227" stroke-dasharray="4 3"/>
    <line x1="340" y1="150" x2="340" y2="180" stroke="#c9a227" stroke-dasharray="4 3"/>
    <line x1="565" y1="150" x2="565" y2="180" stroke="#c9a227" stroke-dasharray="4 3"/>
    <line x1="787" y1="150" x2="787" y2="180" stroke="#c9a227" stroke-dasharray="4 3"/>
  </g>
  <rect x="20" y="330" width="860" height="110" rx="8" fill="#f2f8f2" stroke="#4a8a4a"/>
  <text x="450" y="365" text-anchor="middle" font-size="16" font-weight="bold">あなたが得るもの</text>
  <text x="450" y="395" text-anchor="middle" font-size="15">開発者の手を借りずに、ガイドだけを頼りに、明細から請求書を自分たちで印刷できる</text>
  <text x="450" y="420" text-anchor="middle" font-size="13">(つまずいたときは、invoice の表示とこのガイドで直して進める)</text>
</svg>
