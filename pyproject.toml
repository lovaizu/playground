[project]
name = "invoicer"
version = "1.4.0"
description = "The lines of an invoice, their totals with tax, and the invoice as text."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
invoicer = "invoicer.cli:run"

[tool.setuptools]
packages = ["invoicer"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
