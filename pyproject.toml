[project]
name = "invoicer"
version = "1.5.0"
description = "The lines of an invoice, their totals with tax, and the invoice as text."
requires-python = ">=3.9"

[project.scripts]
invoicer = "invoicer.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["invoicer"]
