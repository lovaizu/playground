# Runs organize-downloads' tests on Linux and macOS on every push, so the pull request shows that
# each behavior holds on both, on the oldest Python the tool supports and on the latest.
name: organize-downloads

on: push

jobs:
  test:
    strategy:
      # Each system and Python reports on its own, so one failing does not hide another.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.x"]
    runs-on: ${{ matrix.os }}
    # lovaizu/playground runs an action only when it is pinned to a full-length commit SHA, which
    # names one commit for good, where a tag such as v7 can be moved. Each SHA is that of the
    # release named in the comment beside it; to update an action, change both together.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # The user stories run the command as pipx installs it for the user.
      - name: Install the tool with pipx
        run: |
          pipx install --python "$(command -v python)" ./organize-downloads
          pipx environment --value PIPX_BIN_DIR >> "$GITHUB_PATH"
      # The module tests run the code as it is in src.
      - name: Run the tests
        working-directory: organize-downloads
        run: PYTHONPATH=src python3 -m unittest discover -s tests
