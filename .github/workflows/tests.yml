# The tests of tests/, on each pull request, on the oldest Python that
# pyproject.toml allows and on the newest, as docs/test-design.md runs them.
name: Tests

on: pull_request

# The tests only read the repository, so the token can change nothing.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # The end-to-end cases install invoicer by pipx, as the README says.
      # pipx runs on the Python of the matrix, so it installs invoicer there.
      - run: python -m pip install pipx
      - run: python -m unittest discover -s tests
      - run: python tests/check_trace.py
