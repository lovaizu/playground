<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500">
  <title>How invoicer works</title>
  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 14px; font-weight: 600; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 12px; }
    .quote { fill: #8250df; font-size: 12px; font-style: italic; }
    .gets { fill: #1a7f37; font-size: 12px; font-weight: 600; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .quote { fill: #c297ff; }
      .gets { fill: #3fb950; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1000" height="500"/>

  <!-- You -->
  <rect class="box" x="20" y="150" width="150" height="60" rx="6"/>
  <text class="name" x="95" y="176">You,</text>
  <text class="name" x="95" y="194">in accounting</text>
  <text class="quote mid" x="95" y="110">"Today it takes</text>
  <text class="quote mid" x="95" y="126">a developer"</text>

  <!-- invoicer -->
  <rect class="frame" x="220" y="20" width="760" height="300" rx="8"/>
  <text class="frame-name start" x="234" y="42">invoicer</text>

  <!-- Doubts above the parts -->
  <text class="quote mid" x="320" y="88">"Does it read your sheet</text>
  <text class="quote mid" x="320" y="104">as you keep it?"</text>
  <text class="quote mid" x="505" y="88">"What if a line or</text>
  <text class="quote mid" x="505" y="104">the rate is wrong?"</text>
  <text class="quote mid" x="690" y="88">"Is the tax right</text>
  <text class="quote mid" x="690" y="104">for this client?"</text>

  <!-- Parts -->
  <rect class="box" x="245" y="150" width="150" height="60" rx="6"/>
  <text class="name" x="320" y="176">Reads your lines</text>
  <text class="name" x="320" y="194">as you keep them</text>
  <rect class="box" x="430" y="150" width="150" height="60" rx="6"/>
  <text class="name" x="505" y="176">Checks each row</text>
  <text class="name" x="505" y="194">and the rate</text>
  <rect class="box" x="615" y="150" width="150" height="60" rx="6"/>
  <text class="name" x="690" y="176">Adds tax at your</text>
  <text class="name" x="690" y="194">rate, to the cent</text>
  <rect class="box" x="800" y="150" width="150" height="60" rx="6"/>
  <text class="name" x="875" y="176">Names, numbers,</text>
  <text class="name" x="875" y="194">and dates it today</text>

  <!-- What you get from each part -->
  <text class="gets mid" x="320" y="240">No retyping</text>
  <text class="gets mid" x="690" y="240">Sums you can trust</text>
  <text class="gets mid" x="875" y="240">Their name, number,</text>
  <text class="gets mid" x="875" y="256">and today's date</text>

  <!-- Flow -->
  <path class="line" d="M170,180 L241,180" marker-end="url(#arrow)"/>
  <text class="label halo mid" x="195" y="232">one command:</text>
  <text class="label halo mid" x="195" y="248">file, client,</text>
  <text class="label halo mid" x="195" y="264">number, rate</text>
  <path class="line" d="M395,180 L426,180" marker-end="url(#arrow)"/>
  <path class="line" d="M580,180 L611,180" marker-end="url(#arrow)"/>
  <path class="line" d="M765,180 L796,180" marker-end="url(#arrow)"/>

  <!-- The stop -->
  <path class="line dashed" d="M505,210 L505,290 L120,290 L120,214" marker-end="url(#arrow)"/>
  <text class="label halo mid" x="320" y="284">stops, and names the row or value to fix</text>
  <text class="gets mid" x="505" y="310">You fix it alone</text>

  <!-- Printer and terminal -->
  <rect class="ext" x="800" y="360" width="150" height="60" rx="6"/>
  <text class="name" x="875" y="386">Your printer</text>
  <text class="name" x="875" y="404">and terminal</text>
  <path class="line" d="M875,210 L875,356" marker-end="url(#arrow)"/>
  <path class="line" d="M800,390 L70,390 L70,214" marker-end="url(#arrow)"/>
  <text class="label halo mid" x="435" y="384">the invoice, on paper and on screen</text>
  <text class="gets mid" x="435" y="414">The right invoice, printed by you, with no developer</text>
  <text class="quote mid" x="435" y="450">"Can you set it up yourself?" One install command and a sample invoice first</text>
</svg>
