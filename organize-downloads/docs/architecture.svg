<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="690" viewBox="0 0 1220 690" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title">
  <title id="title">organize-downloads: logical view</title>
  <style>
    .bg { fill: #ffffff; }
    .text { fill: #1f2328; font-size: 14px; }
    .label { fill: #57606a; font-size: 12px; }
    .code { fill: #f6f8fa; stroke: #1f2328; stroke-width: 1.5; }
    .outside { fill: none; stroke: #57606a; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame { fill: none; stroke: #0969da; stroke-width: 2; }
    .frametext { fill: #0969da; font-size: 14px; font-weight: 600; }
    .arrow { fill: none; stroke: #57606a; stroke-width: 1.5; }
    .head { fill: #57606a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .text { fill: #e6edf3; }
      .label { fill: #9198a1; }
      .code { fill: #161b22; stroke: #e6edf3; }
      .outside { stroke: #9198a1; }
      .frame { stroke: #4493f8; }
      .frametext { fill: #4493f8; }
      .arrow { stroke: #9198a1; }
      .head { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1220" height="690"/>

  <!-- Outside the product -->
  <rect class="outside" x="20" y="60" width="140" height="50" rx="14"/>
  <text class="text" x="90" y="90" text-anchor="middle">pipx or uv</text>
  <rect class="outside" x="20" y="290" width="140" height="50" rx="14"/>
  <text class="text" x="90" y="320" text-anchor="middle">User</text>
  <rect class="outside" x="1030" y="70" width="170" height="50" rx="14"/>
  <text class="text" x="1115" y="99" text-anchor="middle" font-size="13">xdg-user-dirs settings</text>
  <rect class="outside" x="1030" y="190" width="170" height="400" rx="14"/>
  <text class="text" x="1115" y="394" text-anchor="middle">Organized folder</text>

  <!-- The product -->
  <rect class="frame" x="200" y="30" width="780" height="580" rx="6"/>
  <text class="frametext" x="215" y="54">organize-downloads</text>

  <rect class="code" x="230" y="240" width="130" height="150"/>
  <text class="text" x="295" y="320" text-anchor="middle">Command line</text>

  <rect class="code" x="580" y="70" width="160" height="50"/>
  <text class="text" x="660" y="100" text-anchor="middle">Folder finder</text>
  <rect class="code" x="580" y="200" width="160" height="50"/>
  <text class="text" x="660" y="230" text-anchor="middle">Organize planner</text>
  <rect class="code" x="580" y="340" width="160" height="50"/>
  <text class="text" x="660" y="370" text-anchor="middle">Undo planner</text>
  <rect class="code" x="580" y="470" width="160" height="50"/>
  <text class="text" x="660" y="500" text-anchor="middle">Mover</text>

  <rect class="code" x="810" y="125" width="110" height="50"/>
  <text class="text" x="865" y="155" text-anchor="middle">Type table</text>
  <rect class="code" x="810" y="470" width="110" height="50"/>
  <text class="text" x="865" y="500" text-anchor="middle">Run record</text>

  <!-- Into Command line -->
  <path class="arrow" d="M160,85 H295 V238" marker-end="url(#head)"/>
  <text class="label" x="228" y="78" text-anchor="middle">puts it on PATH</text>
  <path class="arrow" d="M160,310 H228" marker-end="url(#head)"/>
  <text class="label" x="194" y="302" text-anchor="middle">types it</text>
  <path class="arrow" d="M230,332 H162" marker-end="url(#head)"/>
  <text class="label" x="196" y="350" text-anchor="middle">prints</text>

  <!-- From Command line -->
  <path class="arrow" d="M360,255 H390 V95 H578" marker-end="url(#head)"/>
  <text class="label" x="484" y="87" text-anchor="middle">asks for the folder</text>
  <path class="arrow" d="M360,280 H410 V150 H808" marker-end="url(#head)"/>
  <text class="label" x="495" y="142" text-anchor="middle">reads it for --help</text>
  <path class="arrow" d="M360,305 H430 V225 H578" marker-end="url(#head)"/>
  <text class="label" x="505" y="217" text-anchor="middle">asks what to move</text>
  <path class="arrow" d="M360,365 H578" marker-end="url(#head)"/>
  <text class="label" x="470" y="357" text-anchor="middle">asks what to put back</text>
  <path class="arrow" d="M360,382 H400 V495 H578" marker-end="url(#head)"/>
  <text class="label" x="490" y="487" text-anchor="middle">hands it the moves</text>

  <!-- From Folder finder -->
  <path class="arrow" d="M740,95 H1028" marker-end="url(#head)"/>
  <text class="label" x="885" y="87" text-anchor="middle">reads the download folder</text>

  <!-- From Organize planner -->
  <path class="arrow" d="M740,212 H890 V177" marker-end="url(#head)"/>
  <text class="label" x="815" y="204" text-anchor="middle">looks up extensions</text>
  <path class="arrow" d="M740,238 H1028" marker-end="url(#head)"/>
  <text class="label" x="885" y="254" text-anchor="middle">lists its files</text>

  <!-- From Undo planner -->
  <path class="arrow" d="M740,355 H1028" marker-end="url(#head)"/>
  <text class="label" x="885" y="347" text-anchor="middle">checks each file</text>
  <path class="arrow" d="M740,378 H865 V468" marker-end="url(#head)"/>
  <text class="label" x="748" y="396">reads last moves</text>

  <!-- From Mover -->
  <path class="arrow" d="M740,495 H808" marker-end="url(#head)"/>
  <text class="label" x="774" y="487" text-anchor="middle">records</text>
  <path class="arrow" d="M740,510 H760 V565 H1028" marker-end="url(#head)"/>
  <text class="label" x="890" y="557" text-anchor="middle">moves files</text>

  <!-- From Run record -->
  <path class="arrow" d="M920,495 H1028" marker-end="url(#head)"/>
  <text class="label" x="950" y="487" text-anchor="middle">keeps it</text>

  <!-- Legend -->
  <rect class="code" x="20" y="635" width="40" height="24"/>
  <text class="text" x="70" y="652">Code does its work</text>
  <rect class="outside" x="260" y="635" width="40" height="24" rx="8"/>
  <text class="text" x="310" y="652">Outside organize-downloads: a person, a program or files</text>
  <rect class="frame" x="740" y="635" width="40" height="24" rx="4"/>
  <text class="text" x="790" y="652">What makes organize-downloads</text>
</svg>
