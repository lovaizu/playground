<svg xmlns="http://www.w3.org/2000/svg" width="860" height="600" viewBox="0 0 860 600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>The logical view of sort-downloads</title>
  <style>
    .bg { fill: #ffffff; }
    .ink { fill: #1f2328; }
    .line { stroke: #1f2328; fill: none; stroke-width: 1.5; }
    .box { fill: #f6f8fa; stroke: #1f2328; stroke-width: 1.5; }
    .frame { fill: none; stroke: #656d76; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .soft { fill: #656d76; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .ink { fill: #e6edf3; }
      .line { stroke: #e6edf3; }
      .box { fill: #161b22; stroke: #e6edf3; }
      .frame { stroke: #8d96a0; }
      .soft { fill: #8d96a0; }
    }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="ink"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="860" height="600"/>

  <rect class="frame" x="20" y="20" width="820" height="530"/>
  <text class="soft" x="36" y="44" font-weight="600">sort-downloads (one file)</text>

  <rect class="box" x="60" y="70" width="220" height="50"/>
  <text class="ink" x="170" y="100" text-anchor="middle">Command reader</text>
  <rect class="box" x="60" y="170" width="220" height="50"/>
  <text class="ink" x="170" y="200" text-anchor="middle">File lister</text>
  <rect class="box" x="60" y="270" width="220" height="50"/>
  <text class="ink" x="170" y="300" text-anchor="middle">Type finder</text>
  <rect class="box" x="60" y="370" width="220" height="50"/>
  <text class="ink" x="170" y="400" text-anchor="middle">Move checker</text>
  <rect class="box" x="60" y="470" width="220" height="50"/>
  <text class="ink" x="170" y="500" text-anchor="middle">Mover</text>
  <rect class="box" x="600" y="70" width="200" height="450"/>
  <text class="ink" x="700" y="300" text-anchor="middle">Reporter</text>

  <line class="line" x1="170" y1="120" x2="170" y2="170" marker-end="url(#head)"/>
  <text class="ink" x="182" y="149">the folder, and whether to move</text>
  <line class="line" x1="170" y1="220" x2="170" y2="270" marker-end="url(#head)"/>
  <text class="ink" x="182" y="249">each file's name, in name order</text>
  <line class="line" x1="170" y1="320" x2="170" y2="370" marker-end="url(#head)"/>
  <text class="ink" x="182" y="349">the name and its type folder, or none</text>
  <line class="line" x1="170" y1="420" x2="170" y2="470" marker-end="url(#head)"/>
  <text class="ink" x="182" y="449">each file free to move, with --move</text>

  <line class="line" x1="280" y1="95" x2="600" y2="95" marker-end="url(#head)"/>
  <text class="ink" x="440" y="87" text-anchor="middle">the folder's full name, or what is wrong</text>
  <line class="line" x1="280" y1="395" x2="600" y2="395" marker-end="url(#head)"/>
  <text class="ink" x="440" y="387" text-anchor="middle">would move, or not moved and why</text>
  <line class="line" x1="280" y1="495" x2="600" y2="495" marker-end="url(#head)"/>
  <text class="ink" x="440" y="487" text-anchor="middle">moved, or cannot move and why</text>

  <rect class="box" x="40" y="566" width="30" height="18"/>
  <text class="ink" x="80" y="580">a component whose work code does (no AI does any)</text>
  <line class="frame" x1="560" y1="575" x2="600" y2="575"/>
  <text class="ink" x="610" y="580">one product</text>
</svg>
