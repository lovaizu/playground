<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 900">
  <title>invoicer's deployment</title>
  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'Hiragino Sans', 'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif; }
    .bg { fill: #ffffff; }
    .ext { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .unit { fill: #ddf4ff; fill-opacity: 0.35; stroke: #0969da; stroke-width: 1.2; }
    .frame { fill: none; stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .kind { fill: #59636e; font-size: 12px; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .data { fill: #8250df; font-size: 12px; font-style: italic; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .head { fill: #59636e; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .ext { fill: #21262d; stroke: #3d444d; }
      .unit { fill: #0c2d6b; stroke: #4493f8; }
      .frame { stroke: #4493f8; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .kind { fill: #9198a1; }
      .data { fill: #c297ff; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1260" height="900"/>
  <rect class="frame" x="20" y="20" width="840" height="400" rx="8"/>
  <text class="frame-name start" x="34" y="42" text-anchor="start">laptop of one from accounting</text>
  <text class="kind start" x="260" y="42" text-anchor="start">[Linux, Python 3.9 or later]</text>
  <rect class="unit" x="60" y="80" width="330" height="110" rx="6"/>
  <text class="name mid" x="225" y="115" text-anchor="middle">invoicer's own environment</text>
  <text class="kind mid" x="225" y="135" text-anchor="middle">[pipx]</text>
  <text class="label small mid" x="225" y="151" text-anchor="middle">command, spreadsheet reader, invoice,</text>
  <text class="label small mid" x="225" y="167" text-anchor="middle">printer, library</text>
  <rect class="unit" x="490" y="80" width="330" height="110" rx="6"/>
  <text class="name mid" x="655" y="115" text-anchor="middle">the folder the command runs in</text>
  <text class="kind mid" x="655" y="135" text-anchor="middle">[file system]</text>
  <text class="data mid" x="655" y="160" text-anchor="middle">Spreadsheet</text>
  <rect class="ext" x="490" y="280" width="330" height="110" rx="6"/>
  <text class="name mid" x="655" y="322" text-anchor="middle">CUPS</text>
  <text class="kind mid" x="655" y="342" text-anchor="middle">[printing system]</text>
  <text class="label small mid" x="655" y="360" text-anchor="middle">the laptop's default printer</text>
  <path class="line" d="M390,135 L486,135" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="438" y="125" text-anchor="middle">reads</text>
  <path class="line" d="M225,190 L225,335 L486,335" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="360" y="325" text-anchor="middle">prints through lp</text>
  <rect class="ext" x="900" y="200" width="330" height="130" rx="6"/>
  <text class="name mid" x="1065" y="250" text-anchor="middle">GitHub</text>
  <text class="kind mid" x="1065" y="270" text-anchor="middle">[the public repository]</text>
  <path class="line" d="M225,80 L225,60 L1065,60 L1065,196" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="700" y="64" text-anchor="middle">fetches the main archive, once, at install</text>
  <rect class="frame" x="20" y="460" width="540" height="180" rx="8"/>
  <text class="frame-name start" x="34" y="482" text-anchor="start">a developer's clone</text>
  <text class="kind start" x="170" y="482" text-anchor="start">[git, lefthook]</text>
  <rect class="unit" x="60" y="505" width="460" height="110" rx="6"/>
  <text class="name mid" x="290" y="540" text-anchor="middle">the repository's files</text>
  <text class="kind mid" x="290" y="560" text-anchor="middle">[git working copy]</text>
  <text class="label small mid" x="290" y="580" text-anchor="middle">the text checks of lefthook.yml, on each commit</text>
  <path class="line" d="M560,480 L580,480 L580,440 L880,440 L880,265 L896,265" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="730" y="444" text-anchor="middle">pushes, and opens pull requests</text>
  <path class="line" d="M1065,330 L1065,456" marker-end="url(#arrow)"/>
  <text class="label small halo start" x="1075" y="378" text-anchor="start">starts each workflow,</text>
  <text class="label small halo start" x="1075" y="394" text-anchor="start">with the code</text>
  <rect class="frame" x="600" y="460" width="640" height="360" rx="8"/>
  <text class="frame-name start" x="614" y="482" text-anchor="start">GitHub's checks</text>
  <text class="kind start" x="730" y="482" text-anchor="start">[GitHub Actions, Ubuntu]</text>
  <rect class="unit" x="620" y="505" width="280" height="120" rx="6"/>
  <text class="name mid" x="760" y="540" text-anchor="middle">Lint workflow</text>
  <text class="kind mid" x="760" y="560" text-anchor="middle">[lovaizu/repofiles, on each push]</text>
  <text class="label small mid" x="760" y="580" text-anchor="middle">the text checks of lefthook.yml</text>
  <rect class="unit" x="920" y="505" width="300" height="295" rx="6"/>
  <text class="name mid" x="1070" y="540" text-anchor="middle">tests' workflow</text>
  <text class="kind mid" x="1070" y="560" text-anchor="middle">[on each pull request]</text>
  <text class="label small mid" x="1070" y="590" text-anchor="middle">a fresh environment,</text>
  <text class="label small mid" x="1070" y="606" text-anchor="middle">Python 3.9 and the newest Python:</text>
  <text class="label small mid" x="1070" y="622" text-anchor="middle">command, spreadsheet reader,</text>
  <text class="label small mid" x="1070" y="638" text-anchor="middle">invoice, printer, library, the tests</text>
  <text class="data mid" x="1070" y="664" text-anchor="middle">Spreadsheet, built by each test</text>
  <rect class="unit" x="620" y="660" width="240" height="120" rx="6"/>
  <text class="name mid" x="740" y="700" text-anchor="middle">stand-in lp</text>
  <text class="kind mid" x="740" y="720" text-anchor="middle">[test double]</text>
  <text class="data mid" x="740" y="742" text-anchor="middle">Invoice, as it was handed over</text>
  <path class="line" d="M920,720 L864,720" marker-end="url(#arrow)"/>
  <text class="label small halo mid" x="892" y="710" text-anchor="middle">prints</text>
  <text class="frame-name start" x="40" y="865" text-anchor="start">Legend</text>
  <rect class="frame" x="110" y="850" width="36" height="22" rx="4"/>
  <text class="label small start" x="154" y="865" text-anchor="start">environment [technology]</text>
  <rect class="unit" x="330" y="850" width="36" height="22" rx="4"/>
  <text class="label small start" x="374" y="865" text-anchor="start">what runs, or a store [technology]: its components</text>
  <text class="data start" x="720" y="865" text-anchor="start">data kept</text>
  <rect class="ext" x="800" y="850" width="36" height="22" rx="4"/>
  <text class="label small start" x="844" y="865" text-anchor="start">a service outside the product, an arrow: what it uses</text>
</svg>
