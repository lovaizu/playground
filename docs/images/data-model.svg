<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 630">
  <title>invoicer's data</title>
  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'Hiragino Sans', 'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif; }
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .name { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .label { fill: #1f2328; font-size: 13px; }
    .small { font-size: 12px; }
    .frame-name { fill: #0969da; font-size: 13px; font-weight: 600; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .head { fill: #59636e; }
    .halo { stroke: #ffffff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    .end { text-anchor: end; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .frame-name { fill: #4493f8; }
      .name, .label { fill: #f0f6fc; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="1000" height="630"/>
  <rect class="box" x="40" y="60" width="220" height="72" rx="0"/>
  <text class="name mid" x="150" y="101" text-anchor="middle">Refusal</text>
  <rect class="box" x="740" y="60" width="220" height="72" rx="0"/>
  <text class="name mid" x="850" y="101" text-anchor="middle">Details</text>
  <rect class="box" x="40" y="250" width="220" height="72" rx="0"/>
  <text class="name mid" x="150" y="291" text-anchor="middle">Spreadsheet</text>
  <rect class="box" x="390" y="250" width="220" height="72" rx="0"/>
  <text class="name mid" x="500" y="291" text-anchor="middle">Line</text>
  <rect class="box" x="740" y="250" width="220" height="72" rx="0"/>
  <text class="name mid" x="850" y="291" text-anchor="middle">Sample</text>
  <rect class="box" x="390" y="440" width="220" height="72" rx="0"/>
  <text class="name mid" x="500" y="481" text-anchor="middle">Invoice</text>
  <path class="line" d="M278,286 L390,286"/>
  <path class="head" d="M260,286 L269,280 L278,286 L269,292 Z"/>
  <text class="label small halo mid" x="288" y="306" text-anchor="middle">1</text>
  <text class="label small halo mid" x="366" y="306" text-anchor="middle">0..*</text>
  <text class="label small halo mid" x="325" y="276" text-anchor="middle">holds</text>
  <path class="line" d="M610,286 L722,286"/>
  <path class="head" d="M740,286 L731,280 L722,286 L731,292 Z"/>
