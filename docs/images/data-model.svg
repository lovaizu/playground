  <text class="label small halo start" x="512" y="432" text-anchor="start">0..1</text>
  <text class="label small halo start" x="512" y="388" text-anchor="start">lists</text>
  <path class="line" d="M610,452 L790,132"/>
  <text class="label small halo start" x="800" y="154" text-anchor="start">1</text>
  <text class="label small halo start" x="628" y="440" text-anchor="start">0..1</text>
  <text class="label small halo start" x="668" y="376" text-anchor="start">is headed by</text>
  <path class="line" d="M150,132 L150,250"/>
  <text class="label small halo start" x="160" y="152" text-anchor="start">0..1</text>
  <text class="label small halo start" x="160" y="242" text-anchor="start">0..1</text>
  <text class="label small halo start" x="160" y="197" text-anchor="start">names</text>
  <path class="line" d="M260,124 L430,250"/>
  <text class="label small halo start" x="292" y="138" text-anchor="start">0..1</text>
  <text class="label small halo end" x="404" y="222" text-anchor="end">0..1</text>
  <text class="label small halo start" x="356" y="180" text-anchor="start">names</text>
  <path class="line" d="M260,96 L740,96"/>
  <text class="label small halo mid" x="284" y="113" text-anchor="middle">0..1</text>
  <text class="label small halo mid" x="714" y="113" text-anchor="middle">0..1</text>
  <text class="label small halo mid" x="500" y="86" text-anchor="middle">names</text>
  <path class="line" d="M40,110 L20,110 L20,490 L390,490"/>
  <text class="label small halo start" x="26" y="152" text-anchor="start">0..1</text>
  <text class="label small halo end" x="382" y="508" text-anchor="end">0..1</text>
  <text class="label small halo mid" x="205" y="480" text-anchor="middle">stands in for the printout of</text>
  <text class="frame-name start" x="40" y="595" text-anchor="start">Legend</text>
  <text class="label small start" x="115" y="595" text-anchor="start">a number at a line's end: how many of the data at that end the other joins</text>
  <path class="head" d="M590,590 L599,584 L608,590 L599,596 Z"/>
  <path class="line" d="M608,590 L640,590"/>
  <text class="label small start" x="650" y="595" text-anchor="start">at the whole, which holds its parts</text>
</svg>
