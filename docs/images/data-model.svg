  <text class="label small halo mid" x="712" y="306" text-anchor="middle">1</text>
  <text class="label small halo mid" x="675" y="276" text-anchor="middle">holds</text>
  <path class="line" d="M850,232 L850,132"/>
  <path class="head" d="M850,250 L844,241 L850,232 L856,241 Z"/>
